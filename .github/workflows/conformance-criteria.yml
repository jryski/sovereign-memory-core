name: Conformance criteria shape

on:
  pull_request:
    paths:
      - "docs/publication/smp-custody-layer.md"
      - "docs/publication/smp-conformance-gap-audit.md"
      - "docs/publication/conformance-criteria-shape.md"
      - "fixtures/conformance/**"
      - "scripts/conformance_criteria.py"
      - "scripts/validate_conformance_criteria.sh"
      - "tests/conformance/**"
      - ".github/workflows/conformance-criteria.yml"
  push:
    paths:
      - "docs/publication/smp-custody-layer.md"
      - "docs/publication/smp-conformance-gap-audit.md"
      - "docs/publication/conformance-criteria-shape.md"
      - "fixtures/conformance/**"
      - "scripts/conformance_criteria.py"
      - "scripts/validate_conformance_criteria.sh"
      - "tests/conformance/**"
      - ".github/workflows/conformance-criteria.yml"

permissions:
  contents: read

jobs:
  criterion-shape:
    name: Positive controls and demonstrated failures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check shell syntax
        run: bash -n scripts/validate_conformance_criteria.sh
      - name: Run criterion-shape conformance
        run: bash scripts/validate_conformance_criteria.sh
