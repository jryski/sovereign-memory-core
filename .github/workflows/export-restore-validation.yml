name: Export/restore validation

on:
  pull_request:
    paths:
      - "release/sovereignty-manifest.schema.json"
      - "scripts/sovereignty_bundle.py"
      - "scripts/validate_sovereignty_bundle.py"
      - "tests/export_restore/**"
      - ".github/workflows/export-restore-validation.yml"
  push:
    paths:
      - "release/sovereignty-manifest.schema.json"
      - "scripts/sovereignty_bundle.py"
      - "scripts/validate_sovereignty_bundle.py"
      - "tests/export_restore/**"
      - ".github/workflows/export-restore-validation.yml"

permissions:
  contents: read

jobs:
  python-export-restore:
    name: Python export/restore (warnings as errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Compile export/restore Python
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/export-restore-pycache
        run: |
          python -m compileall -q scripts/sovereignty_bundle.py scripts/validate_sovereignty_bundle.py tests/export_restore
          test -z "$(find scripts tests/export_restore -type d -name __pycache__ -print -quit)"
      - name: Run export/restore suite
        run: python -m unittest discover -s tests/export_restore -p 'test_*.py' -v
