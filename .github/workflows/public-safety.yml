# Read-only public-safety gate. No database, no Supabase, and no deploy.
name: Public-safety scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safety:
    name: Changed files and regression fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure pull request base is present
        if: github.event_name == 'pull_request'
        run: |
          if ! git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          fi

      - name: Shell syntax
        run: |
          bash -n scripts/public_safety_scan.sh
          bash -n scripts/test_public_safety_scan.sh

      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        run: bash scripts/public_safety_scan.sh --changed --base "${{ github.event.pull_request.base.sha }}"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: bash scripts/public_safety_scan.sh --changed --base "${{ github.event.before }}"

      - name: Scan tracked files on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/public_safety_scan.sh --all

      - name: Regression fixtures
        run: bash scripts/test_public_safety_scan.sh
