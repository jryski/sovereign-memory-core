name: Three-valued fail-closed

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    name: NULL fail-closed matrix (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovereign_tvl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sovereign_tvl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sovereign_tvl
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run NULL fail-closed checker
        run: bash scripts/check_three_valued_fail_closed.sh
