name: C2 provider-exit proof

on:
  pull_request:
    paths:
      - "sql/**"
      - "release/**"
      - "scripts/sovereignty_bundle.py"
      - "scripts/validate_sovereignty_bundle.py"
      - "scripts/c2_provider_exit_rehearsal.py"
      - "scripts/schema_drift_inventory.py"
      - "scripts/build_release_candidate.py"
      - "tests/export_restore/**"
      - ".github/workflows/c2-provider-exit.yml"
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - "release/**"
      - "scripts/sovereignty_bundle.py"
      - "scripts/validate_sovereignty_bundle.py"
      - "scripts/c2_provider_exit_rehearsal.py"
      - "scripts/schema_drift_inventory.py"
      - "scripts/build_release_candidate.py"
      - "tests/export_restore/**"
      - ".github/workflows/c2-provider-exit.yml"

permissions:
  contents: read

jobs:
  provider-exit:
    name: Independent clean restore (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
      SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:55433/postgres
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start independent source and destination clusters
        run: |
          mkdir -p "$RUNNER_TEMP/c2-proof"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'candidate_sha=%s\nhead_tree=%s\n' \
            "$CANDIDATE_SHA" "$(git rev-parse HEAD^{tree})" \
            > "$RUNNER_TEMP/c2-proof/candidate-coordinate.txt"
          docker run -d --name c2-source \
            -e POSTGRES_PASSWORD=postgres -p 55432:5432 postgres:16
          docker run -d --name c2-target \
            -e POSTGRES_PASSWORD=postgres -p 55433:5432 postgres:16
          for container in c2-source c2-target; do
            for attempt in $(seq 1 60); do
              if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$container" | tee "$RUNNER_TEMP/c2-proof/${container}-startup.log"
                exit 1
              fi
              sleep 1
            done
          done
          docker inspect -f '{{.Id}}' c2-source | tee "$RUNNER_TEMP/c2-proof/source-container-id.txt"
          docker inspect -f '{{.Id}}' c2-target | tee "$RUNNER_TEMP/c2-proof/target-container-id.txt"

      - name: Execute exact-artifact provider-exit rehearsal
        run: |
          set -o pipefail
          python -m py_compile scripts/c2_provider_exit_rehearsal.py
          python -m scripts.c2_provider_exit_rehearsal \
            --source-dsn "$SOURCE_DSN" \
            --target-dsn "$TARGET_DSN" \
            --commit "$CANDIDATE_SHA" \
            --output-dir "$RUNNER_TEMP/c2-proof" \
            2>&1 | tee "$RUNNER_TEMP/c2-proof/rehearsal.log"
          python scripts/validate_sovereignty_bundle.py \
            "$RUNNER_TEMP/c2-proof/sovereign-memory-c2.bundle.tar" \
            --expected-sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/c2-proof/archive.sha256")" \
            2>&1 | tee "$RUNNER_TEMP/c2-proof/validator.log"

      - name: Capture and compare executable schema drift inventory
        run: |
          set -o pipefail
          python -m py_compile scripts/schema_drift_inventory.py
          tree_sha="$(git rev-parse HEAD^{tree})"
          python scripts/schema_drift_inventory.py capture \
            --dsn-env SOURCE_DSN \
            --sql-output "$RUNNER_TEMP/c2-proof/source-schema.sql" \
            --receipt-output "$RUNNER_TEMP/c2-proof/source-schema-inventory.json" \
            2>&1 | tee "$RUNNER_TEMP/c2-proof/source-schema-inventory.log"
          python scripts/schema_drift_inventory.py capture \
            --dsn-env TARGET_DSN \
            --sql-output "$RUNNER_TEMP/c2-proof/target-schema.sql" \
            --receipt-output "$RUNNER_TEMP/c2-proof/target-schema-inventory.json" \
            2>&1 | tee "$RUNNER_TEMP/c2-proof/target-schema-inventory.log"
          python scripts/schema_drift_inventory.py compare \
            --expected "$RUNNER_TEMP/c2-proof/source-schema.sql" \
            --actual "$RUNNER_TEMP/c2-proof/target-schema.sql" \
            --receipt-output "$RUNNER_TEMP/c2-proof/schema-drift-comparison.json" \
            --diff-output "$RUNNER_TEMP/c2-proof/schema-drift.diff" \
            --exact-commit "$CANDIDATE_SHA" \
            --exact-tree "$tree_sha" \
            2>&1 | tee "$RUNNER_TEMP/c2-proof/schema-drift-comparison.log"

      - name: Build exact-commit release candidate assets
        run: |
          set -o pipefail
          python -m py_compile scripts/build_release_candidate.py
          tree_sha="$(git rev-parse HEAD^{tree})"
          python scripts/build_release_candidate.py \
            --version v0.3-alpha \
            --commit "$CANDIDATE_SHA" \
            --tree "$tree_sha" \
            --repo-root . \
            --proof-dir "$RUNNER_TEMP/c2-proof" \
            --output-dir "$RUNNER_TEMP/c2-proof/release-candidate" \
            2>&1 | tee "$RUNNER_TEMP/c2-proof/release-candidate.log"
          (cd "$RUNNER_TEMP/c2-proof/release-candidate" && sha256sum -c CHECKSUMS.sha256) \
            | tee "$RUNNER_TEMP/c2-proof/release-candidate-checksums.log"

      - name: Probe exact release bindings
        run: |
          set -o pipefail
          tree_sha="$(git rev-parse HEAD^{tree})"
          exact_known="$RUNNER_TEMP/c2-proof/exact-known-limitations.md"
          git show "$CANDIDATE_SHA:release/v0.3-alpha-known-limitations.md" > "$exact_known"
          printf '\nDIRTY_RELEASE_BINDING_SENTINEL\n' >> release/v0.3-alpha-known-limitations.md
          python scripts/build_release_candidate.py \
            --version v0.3-alpha \
            --commit "$CANDIDATE_SHA" \
            --tree "$tree_sha" \
            --repo-root . \
            --proof-dir "$RUNNER_TEMP/c2-proof" \
            --output-dir "$RUNNER_TEMP/c2-proof/release-candidate-dirty-probe" \
            > "$RUNNER_TEMP/c2-proof/dirty-binding-probe.log"
          cmp "$exact_known" "$RUNNER_TEMP/c2-proof/release-candidate-dirty-probe/KNOWN_LIMITATIONS.md"
          if grep -q 'DIRTY_RELEASE_BINDING_SENTINEL' "$RUNNER_TEMP/c2-proof/release-candidate-dirty-probe/KNOWN_LIMITATIONS.md"; then
            echo 'dirty working-tree limitations escaped exact-commit binding' >&2
            exit 1
          fi
          git checkout -- release/v0.3-alpha-known-limitations.md

          cp "$RUNNER_TEMP/c2-proof/schema-drift-comparison.json" \
             "$RUNNER_TEMP/c2-proof/schema-drift-comparison.bound.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "c2-proof" / "schema-drift-comparison.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          value["exact_commit"] = "0" * 40
          path.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          if python scripts/build_release_candidate.py \
            --version v0.3-alpha \
            --commit "$CANDIDATE_SHA" \
            --tree "$tree_sha" \
            --repo-root . \
            --proof-dir "$RUNNER_TEMP/c2-proof" \
            --output-dir "$RUNNER_TEMP/c2-proof/release-candidate-stale-drift-probe" \
            > "$RUNNER_TEMP/c2-proof/stale-drift-probe.log" 2>&1; then
            echo 'stale schema-drift receipt was unexpectedly accepted' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/c2-proof/schema-drift-comparison.bound.json" \
             "$RUNNER_TEMP/c2-proof/schema-drift-comparison.json"

      - name: Destroy independent clusters
        if: always()
        run: |
          set +e
          target_id="$(cat "$RUNNER_TEMP/c2-proof/target-container-id.txt" 2>/dev/null)"
          source_id="$(cat "$RUNNER_TEMP/c2-proof/source-container-id.txt" 2>/dev/null)"
          docker rm -f c2-target >/dev/null 2>&1
          target_status=$?
          if docker inspect c2-target >/dev/null 2>&1; then
            target_gone=false
          else
            target_gone=true
          fi
          printf 'destroy_command_status=%s\ndestroyed=%s\ncontainer_id=%s\n' \
            "$target_status" "$target_gone" "$target_id" \
            > "$RUNNER_TEMP/c2-proof/destination-destroyed.txt"
          docker rm -f c2-source >/dev/null 2>&1
          source_status=$?
          if docker inspect c2-source >/dev/null 2>&1; then
            source_gone=false
          else
            source_gone=true
          fi
          printf 'destroy_command_status=%s\ndestroyed=%s\ncontainer_id=%s\n' \
            "$source_status" "$source_gone" "$source_id" \
            > "$RUNNER_TEMP/c2-proof/source-destroyed.txt"
          if [ "$target_gone" != true ] || [ "$source_gone" != true ]; then
            exit 1
          fi

      - name: Upload proof or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c2-provider-exit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c2-proof/
          if-no-files-found: error
          retention-days: 30
