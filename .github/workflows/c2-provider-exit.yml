name: C2 provider-exit proof

on:
  pull_request:
    paths:
      - "sql/**"
      - "release/**"
      - "scripts/sovereignty_bundle.py"
      - "scripts/validate_sovereignty_bundle.py"
      - "scripts/c2_provider_exit_rehearsal.py"
      - "tests/export_restore/**"
      - ".github/workflows/c2-provider-exit.yml"
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - "release/**"
      - "scripts/sovereignty_bundle.py"
      - "scripts/validate_sovereignty_bundle.py"
      - "scripts/c2_provider_exit_rehearsal.py"
      - "tests/export_restore/**"
      - ".github/workflows/c2-provider-exit.yml"

permissions:
  contents: read

jobs:
  provider-exit:
    name: Independent clean restore (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
      SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:55433/postgres

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start independent source and destination clusters
        run: |
          docker run -d --name c2-source \
            -e POSTGRES_PASSWORD=postgres -p 55432:5432 postgres:16
          docker run -d --name c2-target \
            -e POSTGRES_PASSWORD=postgres -p 55433:5432 postgres:16
          for container in c2-source c2-target; do
            for attempt in $(seq 1 60); do
              if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$container"
                exit 1
              fi
              sleep 1
            done
          done
          docker inspect -f '{{.Id}}' c2-source | tee "$RUNNER_TEMP/source-container-id.txt"
          docker inspect -f '{{.Id}}' c2-target | tee "$RUNNER_TEMP/target-container-id.txt"

      - name: Execute exact-artifact provider-exit rehearsal
        run: |
          mkdir -p "$RUNNER_TEMP/c2-proof"
          cp "$RUNNER_TEMP/source-container-id.txt" "$RUNNER_TEMP/c2-proof/"
          cp "$RUNNER_TEMP/target-container-id.txt" "$RUNNER_TEMP/c2-proof/"
          python scripts/c2_provider_exit_rehearsal.py \
            --source-dsn "$SOURCE_DSN" \
            --target-dsn "$TARGET_DSN" \
            --commit "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/c2-proof"
          python scripts/validate_sovereignty_bundle.py \
            "$RUNNER_TEMP/c2-proof/sovereign-memory-c2.bundle.tar" \
            --expected-sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/c2-proof/archive.sha256")"

      - name: Prove destination was disposable and destroy both clusters
        if: success()
        run: |
          target_id="$(cat "$RUNNER_TEMP/c2-proof/target-container-id.txt")"
          source_id="$(cat "$RUNNER_TEMP/c2-proof/source-container-id.txt")"
          docker rm -f c2-target >/dev/null
          if docker inspect c2-target >/dev/null 2>&1; then
            echo "destination container still exists" >&2
            exit 1
          fi
          printf 'destroyed=true\ncontainer_id=%s\n' "$target_id" \
            > "$RUNNER_TEMP/c2-proof/destination-destroyed.txt"
          docker rm -f c2-source >/dev/null
          if docker inspect c2-source >/dev/null 2>&1; then
            echo "source container still exists" >&2
            exit 1
          fi
          printf 'destroyed=true\ncontainer_id=%s\n' "$source_id" \
            > "$RUNNER_TEMP/c2-proof/source-destroyed.txt"

      - name: Upload proof receipt and deterministic bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c2-provider-exit-${{ github.sha }}
          path: ${{ runner.temp }}/c2-proof/
          if-no-files-found: error
          retention-days: 30
