name: Agent-operations contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  signature-checker:
    name: Digest and public signature surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check the sanitized contract
        run: |
          python -m unittest discover -s tests/agent_operations -p 'test_*.py' -v
          python3 scripts/check_agent_operations_contract.py
          python3 scripts/check_agent_operations_contract.py \
            --corpus fixtures/agent-operations/synthetic-current-surface.md

  hot-summary-probe:
    name: Synthetic hot-summary profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sovereign_memory
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d sovereign_memory"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sovereign_memory
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run the disposable hot-summary probe
        run: bash scripts/run_hot_summary_profile.sh
